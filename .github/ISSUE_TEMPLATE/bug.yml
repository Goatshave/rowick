name: Bug report
description: Report a reproducible Rowick defect
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security vulnerabilities must follow SECURITY.md. First-time contributors need maintainer approval before their first PR; approved contributors can submit routine fixes directly.
  - type: input
    id: packages
    attributes:
      label: Affected package and version
      placeholder: "@rowick/react-ui 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - React
        - Vue
        - Svelte
        - Framework-agnostic core
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a repository, sandbox, or exact runnable steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, OS, Node.js, package manager, and relevant framework versions.
    validations:
      required: true
  - type: dropdown
    id: contribution-intent
    attributes:
      label: Would you like to work on this?
      description: Reporting a problem does not require offering an implementation.
      options:
        - Report or discuss only
        - I would like to work on this (first-time contributors need approval)
    validations:
      required: true
  - type: checkboxes
    id: approval-policy
    attributes:
      label: Contribution policy
      options:
        - label: I understand that first-time contributors must wait until their account is approved on the default branch before opening a PR, including a draft. Large changes still need prior discussion after contributor approval.
          required: true
