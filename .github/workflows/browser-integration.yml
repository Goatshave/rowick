name: Browser Integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.browser }} (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install selected browser
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"

      - name: Run integration shard
        run: pnpm e2e:integration --project "${{ matrix.browser }}" --shard "${{ matrix.shard }}/2"

      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure-${{ github.workflow }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
