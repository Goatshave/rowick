<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 128" width="438" height="128" role="img" aria-labelledby="title description">
  <title id="title">Rowick</title>
  <desc id="description">Rowick wordmark with the charcoal and apricot enamel active-cell symbol.</desc>
  <defs>
    <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#625E59"/><stop offset=".38" stop-color="#4B4946"/><stop offset=".78" stop-color="#403E3B"/><stop offset="1" stop-color="#57514C"/>
    </linearGradient>
    <linearGradient id="apricot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0C39C"/><stop offset=".36" stop-color="#E4AF86"/><stop offset=".84" stop-color="#D49A70"/><stop offset="1" stop-color="#E6B38C"/>
    </linearGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A89E91"/><stop offset=".5" stop-color="#817B73"/><stop offset="1" stop-color="#B1A394"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4F1E9" stop-opacity=".62"/><stop offset=".27" stop-color="#F4F1E9" stop-opacity=".06"/><stop offset=".7" stop-color="#F4F1E9" stop-opacity=".02"/><stop offset="1" stop-color="#F4F1E9" stop-opacity=".44"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#FFF8ED" stop-opacity=".65"/><stop offset=".35" stop-color="#FFF8ED" stop-opacity=".21"/><stop offset="1" stop-color="#FFF8ED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".55" stop-color="#FFF8ED" stop-opacity="0"/><stop offset=".88" stop-color="#FFF8ED" stop-opacity=".85"/><stop offset="1" stop-color="#FFF8ED" stop-opacity="0"/>
    </linearGradient>
    <g id="coat">
      <rect x=".45" y=".45" width="63.1" height="63.1" rx="14.55" fill="none" stroke="url(#rim)" stroke-width=".9"/>
      <path d="M3 26V17C3 8.8 8.8 3 17 3H43C49 3 51 4.2 51 6.1C51 8.4 46.4 8.8 41 8.8H22C12.2 8.8 8.5 12.2 7 20.5C6.1 25 4.3 27.5 3 26Z" fill="url(#sheen)"/>
      <path d="M61 42V47C61 56 56 61 47 61H44" fill="none" stroke="url(#glint)" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="fixed-cell"><rect width="64" height="64" rx="15" fill="url(#charcoal)"/><use href="#coat"/></g>
    <g id="active-cell"><rect width="64" height="64" rx="15" fill="url(#apricot)"/><use href="#coat"/></g>
  </defs>
<g transform="translate(0 13) scale(.63)"><g>
    <rect x="78" y="20" width="64" height="64" rx="15" fill="none" stroke="url(#outline)" stroke-width="4"/>
    <use href="#fixed-cell" x="8" y="20"/>
    <use href="#fixed-cell" x="8" y="90"/>
    <use href="#fixed-cell" x="78" y="90"/>
    <use href="#active-cell" x="90" y="8"/>
  </g></g>
